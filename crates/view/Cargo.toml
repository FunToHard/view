[package]
name = "view"
description = "Native Rust UI with retained and on-demand immediate composition."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
# Registry naming and release qualification are separate from repository setup.
publish = false

[dependencies]
view-core.workspace = true
view-text = { workspace = true, optional = true }
view-wgpu = { workspace = true, optional = true }
view-controls = { workspace = true, optional = true }
view-resource = { workspace = true, optional = true }
view-webview = { workspace = true, optional = true }
view-addons = { workspace = true, optional = true }

[features]
addons = ["dep:view-addons"]
addons-render = ["addons", "view-addons/render"]
webview = ["dep:view-webview"]
webview-native = ["webview", "view-webview/native"]
resources = ["dep:view-resource"]
image-bmp = ["resources", "view-resource/image-bmp"]
text = ["dep:view-text"]
text-shaping = ["text", "view-text/shaping"]
wgpu = ["dep:view-wgpu", "text-shaping"]
scene = ["wgpu", "view-wgpu/scene"]
controls = ["dep:view-controls", "text-shaping"]
controls-render = ["controls", "wgpu", "view-controls/render"]
accessibility = ["controls", "view-controls/accessibility"]

[lints]
workspace = true

[[example]]
name = "async_branch"
required-features = ["resources"]

[[example]]
name = "form"
required-features = ["controls"]
