[package]
name = "view-platform"
description = "Native platform adapter for view using winit and Windows bindings."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
view-core.workspace = true
view-text = { workspace = true, optional = true }
winit = { workspace = true }

[features]
text = ["dep:view-text", "windows/Win32_System_DataExchange", "windows/Win32_System_Memory"]
clipboard-test = ["text", "windows/Win32_System_StationsAndDesktops", "windows/Win32_Security", "windows/Win32_Graphics_Gdi"]

[[example]]
name = "clipboard_isolated"
required-features = ["clipboard-test"]

[target.'cfg(target_os = "linux")'.dependencies]
winit = { workspace = true, features = ["x11", "wayland", "wayland-dlopen"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, default-features = false, features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
    "Win32_UI_HiDpi",
    "Win32_UI_Controls",
    "Win32_System_Com",
] }
