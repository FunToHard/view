[workspace]
members = [
    "crates/view",
    "crates/view-core",
    "crates/view-testing",
    "crates/platform-probe",
    "tools/dependency-probe",
]
exclude = ["tests/compatibility/facade-consumer"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/FunToHard/view.git"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[workspace.dependencies]
view-core = { path = "crates/view-core", version = "0.1.0" }
view-testing = { path = "crates/view-testing", version = "0.1.0" }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }
windows = { version = "0.62.2", default-features = false }
wgpu = { version = "30.0.0", default-features = false, features = ["std", "dx12", "metal", "vulkan", "wgsl"] }
cosmic-text = { version = "0.19.0", default-features = false, features = ["std", "swash"] }
glyphon = "0.12.0"
accesskit = "0.25.1"
accesskit_winit = { version = "0.34.1", default-features = false, features = ["rwh_06"] }
lyon = { version = "1.0.16", default-features = false }
unicode-segmentation = "1.13.3"
bytemuck = { version = "1.24.0", features = ["derive"] }
