[package]
name = "view-facade-consumer"
version = "0.0.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[dependencies]
view = { path = "../../../crates/view", version = "0.1.0", default-features = false }
view-testing = { path = "../../../crates/view-testing", version = "0.1.0", default-features = false, optional = true }
view-markdown = { path = "../../../crates/view-markdown", version = "0.1.0", optional = true }
view-automation = { path = "../../../crates/view-automation", version = "0.1.0", optional = true }

[features]
automation = ["dep:view-automation", "harness"]
markdown = ["dep:view-markdown"]
resources = ["view/resources"]
harness = ["dep:view-testing"]
text = ["view/text"]
text-shaping = ["text", "view/text-shaping"]
wgpu = ["view/wgpu"]
scene = ["view/scene"]
controls = ["view/controls"]
accessibility = ["controls", "view/accessibility"]
controls-render = ["controls", "view/controls-render"]
