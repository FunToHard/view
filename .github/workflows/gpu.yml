name: Provisioned GPU qualification
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Provisioned runner platform (see docs/plan/runner-contract.md)
        type: choice
        options: [windows, linux, macos]
        required: true
permissions:
  contents: read
jobs:
  gpu:
    # Never run untrusted PR jobs on an interactive/personal runner.
    runs-on: [self-hosted, view-gpu, '${{ inputs.platform }}']
    timeout-minutes: 20
    concurrency: view-gpu-${{ inputs.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - shell: pwsh
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          $backend = @{ windows='dx12'; linux='vulkan'; macos='metal' }[$env:PLATFORM]
          ./scripts/verify.ps1 -Gpu -Backend $backend
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gpu-${{ inputs.platform }}
          path: target/verification/
          if-no-files-found: error
          retention-days: 14
